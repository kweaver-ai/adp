{{- $env := include "mergedGlobalValues.env" . | fromYaml -}}
{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
{{- $accessAddress := include "mergedGlobalValues.accessAddress" . | fromYaml -}}
{{- $depServices := include "mergedGlobalValues.depServices" . | fromYaml -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-cm
  namespace: {{ .Release.Namespace }}
data:
  application.yml: |-
    server:
      port: 8099
      max-http-header-size: 512KB
    spring:
      main:
        allow-circular-references: true
      application:
        name: vega-gateway
        version: 1.0.0
        queryName: vega-calculate-coordinator
      mvc:
        throw-exception-if-no-handler-found: true
        pathmatch:
          matching-strategy: ANT_PATH_MATCHER
      servlet:
        multipart:
          max-file-size: 10MB
          max-request-size: 10MB
      datasource:
        dynamic:
          primary: default  # 指定默认数据源
          strict: false # true：找不到数据源报错
          lazy: true
          datasource:
            default:
              {{- if eq $depServices.rds.type "DM8" }}
              driver-class-name: dm.jdbc.driver.DmDriver
              url: jdbc:dm://{{ $depServices.rds.host }}:{{ $depServices.rds.port }}?schema=adp
              {{- else }}
              driver-class-name: org.mariadb.jdbc.Driver
              url: jdbc:mariadb://{{ $depServices.rds.host }}:{{ $depServices.rds.port }}/adp?useUnicode=true&useSSL=false&characterEncoding=utf8mb4&serverTimezone=GMT%2B8
              {{- end }}
              username: {{ $depServices.rds.user }}
              password: {{ $depServices.rds.password }}
              type: com.alibaba.druid.pool.DruidDataSource
              druid:
                initial-size: 5
                min-idle: 5
                max-active: 300
                max-wait: 60000
                test-while-idle: true
                time-between-eviction-runs-millis: 60000
                min-evictable-idle-time-millis: 30000
                validation-query: select 'x'
                test-on-borrow: false
                test-on-return: false
                pool-prepared-statements: true
                max-pool-prepared-statement-per-connection-size: 20
    mybatis-plus:
      global-config:
        banner: false
        enable-sql-runner: true
      mapper-locations: classpath*:com/**/mapper/xml/*.xml
      configuration:
        log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    openlookeng:
      url: {{ $depServices.vega_calculate.protocol }}://{{ $depServices.vega_calculate.service }}:{{ $depServices.vega_calculate.port }}
      connect-timeout: {{ $depServices.vega_calculate.timeout }}
      jdbc:
        pushdown-module: FULL_PUSHDOWN
    olk:
      view:
        catalog: olk_view_vdm
      connector:
        name: mysql,maria,hive-hadoop2,postgresql,clickhouse,doris,oracle,sqlserver,hive-jdbc,hologres,inceptor-jdbc
    sql:
      enabled: true

    af-auth:
      is-open: true
      register-clientid-url: {{ $depServices.hydra.administrativeProtocol }}://{{ $depServices.hydra.administrativeHost }}:{{ $depServices.hydra.administrativePort }}/admin/clients
      clientid-token: {{ $depServices.hydra.publicProtocol }}://{{ $depServices.hydra.publicHost }}:{{ $depServices.hydra.publicPort }}/oauth2/token
      token-introspect: {{ $depServices.hydra.administrativeProtocol }}://{{ $depServices.hydra.administrativeHost }}:{{ $depServices.hydra.administrativePort }}/admin/oauth2/introspect
      row-column-rule: {{ $depServices.authService.protocol }}://{{ $depServices.authService.host }}:{{ $depServices.authService.port }}/api/auth-service/v1/sub-views

    anyrobot:
      log:
        enabled: {{ .Values.service.telemetry.log.enabled }}
        endpoint: {{ .Values.service.telemetry.log.endpoint }}
        level: {{ .Values.service.telemetry.log.level }}
      trace:
        enabled: {{ .Values.service.telemetry.trace.enabled }}
        endpoint: {{ .Values.service.telemetry.trace.endpoint }}
    logging:
      config: classpath:logback-spring.xml

    collector-data-source: {{ .Values.collectorDataSource }} #扫描用数据源，列表过滤时使用

    services:
      efast-public: {{ $depServices.efast.publicProtocol }}://{{ $depServices.efast.publicHost }}:{{ $depServices.efast.publicPort }}
